name: GTT 0.1.36 roadside dispatch contract sanity

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  roadside-dispatch-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify locked roadside dispatch authority
        run: python Scripts/verify_roadside_dispatch_contract.py
