name: GTT Win64 attested candidate acceptance

on:
  workflow_call:
    inputs:
      version:
        description: 'Exact candidate version; must match Config/DefaultGame.ini'
        required: true
        type: string
      configuration:
        description: 'Unreal build configuration'
        required: true
        type: string
      engine_root:
        description: 'UE 5.8 installation root on the qualifying self-hosted runner'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact candidate version; must match Config/DefaultGame.ini'
        required: true
        default: '0.1.69'
      configuration:
        description: 'Unreal build configuration'
        required: true
        type: choice
        options: [Shipping, Development]
        default: Shipping
      engine_root:
        description: 'UE 5.8 installation root on the qualifying self-hosted runner'
        required: true
        default: 'C:\Program Files\Epic Games\UE_5.8'

permissions:
  contents: read

concurrency:
  group: gtt-win64-attested-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-candidate:
    name: Exact UE 5.8 Win64 package, runtime, visual evidence and archive attestation
    runs-on: [self-hosted, windows, x64, unreal-5.8]
    timeout-minutes: 120
    env:
      GTT_VERSION: ${{ inputs.version }}
      GTT_CONFIGURATION: ${{ inputs.configuration }}
      GTT_ENGINE_ROOT: ${{ inputs.engine_root }}
      GTT_PACKAGE_DIR: ${{ github.workspace }}\Releases\GTT-${{ inputs.version }}-Windows-${{ inputs.configuration }}
      GTT_QUALIFICATION_DIR: ${{ github.workspace }}\Saved\Win64\RunnerQualification
    steps:
      - name: Checkout exact source and LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Qualify self-hosted UE 5.8 runner before expensive acceptance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GTT_QUALIFICATION_DIR" | Out-Null
          ./Scripts/qualify_win64_runner.ps1 `
            -EngineRoot "$env:GTT_ENGINE_ROOT" `
            -ProjectFile "${{ github.workspace }}\GTT.uproject" `
            -OutputPath "$env:GTT_QUALIFICATION_DIR\WIN64_RUNNER_QUALIFICATION.json" `
            -ExpectedGitSha "${{ github.sha }}" `
            -ExpectedVersion "$env:GTT_VERSION" `
            -MinimumFreeGiB 25

      - name: Upload runner qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GTT-Win64-runner-qualification-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ env.GTT_QUALIFICATION_DIR }}\WIN64_RUNNER_QUALIFICATION.json
            ${{ env.GTT_QUALIFICATION_DIR }}\WIN64_RUNNER_QUALIFICATION.json.preflight.json
            ${{ env.GTT_QUALIFICATION_DIR }}\WIN64_RUNNER_QUALIFICATION.json.editor-probe.log

      - name: Qualify exact Win64 candidate
        shell: pwsh
        run: >-
          ./Scripts/run_win64_attested_candidate_acceptance.ps1
          -EngineRoot "$env:GTT_ENGINE_ROOT"
          -Configuration "$env:GTT_CONFIGURATION"
          -Version "$env:GTT_VERSION"
          -PackageDirectory "$env:GTT_PACKAGE_DIR"

      - name: Verify exact-candidate identity and archive boundary before upload
        shell: pwsh
        run: |
          $summaryPath = Join-Path $env:GTT_PACKAGE_DIR 'WIN64_ACCEPTANCE_SUMMARY.json'
          $attestationPath = Join-Path $env:GTT_PACKAGE_DIR 'WIN64_CANDIDATE_ATTESTATION.json'
          $manifestPath = Join-Path $env:GTT_PACKAGE_DIR 'FINAL_SHA256SUMS.txt'
          $zipPath = "$env:GTT_PACKAGE_DIR.zip"
          $zipHashPath = "$zipPath.sha256"
          $archiveVerificationPath = "$zipPath.verify.json"
          $trailerArchiveVerificationPath = "$zipPath.trailer-editor-verify.json"
          foreach ($path in @($summaryPath,$attestationPath,$manifestPath,$zipPath,$zipHashPath,$archiveVerificationPath,$trailerArchiveVerificationPath)) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Required candidate artifact missing: $path" }
          }
          $summary = Get-Content -Raw $summaryPath | ConvertFrom-Json
          $attestation = Get-Content -Raw $attestationPath | ConvertFrom-Json
          $archiveVerification = Get-Content -Raw $archiveVerificationPath | ConvertFrom-Json
          $trailerArchiveVerification = Get-Content -Raw $trailerArchiveVerificationPath | ConvertFrom-Json
          foreach ($doc in @($summary,$attestation,$archiveVerification,$trailerArchiveVerification)) {
            if ($doc.result -ne 'PASS' -or $doc.git_sha -ne '${{ github.sha }}' -or $doc.version -ne $env:GTT_VERSION -or $doc.configuration -ne $env:GTT_CONFIGURATION) {
              throw 'Candidate identity mismatch between checkout and attested/archive evidence.'
            }
            if ($doc.human_visual_review -ne 'REQUIRED' -or [bool]$doc.demo_release_authorized) {
              throw 'Technical candidate must keep human visual review REQUIRED and Demo Release unauthorized.'
            }
          }
          if ($attestation.schema -ne 'gtt.win64-candidate-attestation.v1' -or [int]$attestation.technical_gate_schema -ne 17) {
            throw 'Unexpected candidate attestation schema or technical gate schema.'
          }
          if ($archiveVerification.schema -ne 'gtt.win64-candidate-archive-verification.v1' -or
              $archiveVerification.platform -ne 'Win64' -or
              $archiveVerification.engine -ne 'Unreal Engine 5.8') {
            throw 'Unexpected archive verification schema/platform/engine.'
          }
          if ($trailerArchiveVerification.schema -ne 'gtt.authored-trailer-archive-evidence.v1' -or
              $trailerArchiveVerification.authored_skeletal_mesh -ne 'PASS' -or
              $trailerArchiveVerification.authored_skeleton -ne 'PASS' -or
              $trailerArchiveVerification.authored_physics_asset -ne 'PASS' -or
              $trailerArchiveVerification.final_hitch_socket -ne 'PASS' -or
              $trailerArchiveVerification.final_axle_sockets -ne 'PASS' -or
              $trailerArchiveVerification.skeletal_wheel_bones -ne 'PASS') {
            throw 'Authored trailer sealed-archive evidence is incomplete.'
          }
          $expectedLine = (Get-Content -Raw $zipHashPath).Trim()
          $actualHash = (Get-FileHash -Algorithm SHA256 -Path $zipPath).Hash.ToLowerInvariant()
          if (-not $expectedLine.StartsWith($actualHash + '  ')) { throw 'Candidate ZIP hash sidecar does not match the produced archive.' }
          if ($archiveVerification.archive_sha256 -ne $actualHash) { throw 'Archive verification hash does not match uploaded ZIP bytes.' }
          if ($trailerArchiveVerification.archive_sha256 -ne $actualHash) { throw 'Authored trailer archive evidence hash does not match uploaded ZIP bytes.' }

      - name: Bind exact qualifying runner/toolchain to sealed candidate archive
        shell: pwsh
        run: |
          ./Scripts/bind_win64_runner_to_candidate.ps1 `
            -PackageDirectory "$env:GTT_PACKAGE_DIR" `
            -RunnerQualificationPath "$env:GTT_QUALIFICATION_DIR\WIN64_RUNNER_QUALIFICATION.json" `
            -Version "$env:GTT_VERSION" `
            -Configuration "$env:GTT_CONFIGURATION" `
            -ExpectedGitSha "${{ github.sha }}" `
            -OutputPath "$env:GTT_PACKAGE_DIR.zip.runner-bind.json"

          $bindingPath = "$env:GTT_PACKAGE_DIR.zip.runner-bind.json"
          if (-not (Test-Path $bindingPath -PathType Leaf)) { throw "Runner/candidate binding evidence missing." }
          $binding = Get-Content -Raw $bindingPath | ConvertFrom-Json
          if ($binding.schema -ne 'gtt.win64-runner-candidate-binding.v1' -or $binding.result -ne 'PASS' -or
              $binding.git_sha -ne '${{ github.sha }}' -or $binding.version -ne $env:GTT_VERSION -or
              $binding.configuration -ne $env:GTT_CONFIGURATION -or $binding.human_visual_review -ne 'REQUIRED' -or
              [bool]$binding.demo_release_authorized) {
            throw 'Runner/candidate binding does not match exact qualified candidate/release boundary.'
          }
          $zipHash = (Get-FileHash -Algorithm SHA256 -Path "$env:GTT_PACKAGE_DIR.zip").Hash.ToLowerInvariant()
          if ($binding.candidate_archive.sha256 -ne $zipHash) { throw 'Runner/candidate binding archive hash mismatch.' }

      - name: Prepare immutable exact-candidate human review packet
        shell: pwsh
        run: |
          $packetPath = "$env:GTT_PACKAGE_DIR.zip.human-review-packet.json"
          ./Scripts/prepare_demo_human_review_packet.ps1 `
            -PackageDirectory "$env:GTT_PACKAGE_DIR" `
            -Version "$env:GTT_VERSION" `
            -Configuration "$env:GTT_CONFIGURATION" `
            -ExpectedGitSha "${{ github.sha }}" `
            -OutputPath "$packetPath"

          if (-not (Test-Path $packetPath -PathType Leaf)) { throw 'Human review packet was not produced.' }
          $packet = Get-Content -Raw $packetPath | ConvertFrom-Json
          $zipHash = (Get-FileHash -Algorithm SHA256 -Path "$env:GTT_PACKAGE_DIR.zip").Hash.ToLowerInvariant()
          if ($packet.schema -ne 'gtt.demo-human-review-packet.v1' -or
              $packet.status -ne 'READY_FOR_HUMAN_REVIEW' -or
              $packet.git_sha -ne '${{ github.sha }}' -or
              $packet.version -ne $env:GTT_VERSION -or
              $packet.configuration -ne $env:GTT_CONFIGURATION -or
              $packet.archive_sha256 -ne $zipHash -or
              $packet.human_visual_review -ne 'PENDING' -or
              [bool]$packet.demo_release_authorized) {
            throw 'Human review packet is not bound to the exact sealed candidate/release boundary.'
          }
          if (@($packet.screenshots).Count -ne 5 -or @($packet.criteria).Count -ne 5) {
            throw 'Human review packet does not contain the complete five-scene/five-criterion witness set.'
          }

      - name: Upload exact attested technical candidate
        uses: actions/upload-artifact@v4
        with:
          name: GTT-${{ inputs.version }}-Win64-attested-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.GTT_PACKAGE_DIR }}.zip
            ${{ env.GTT_PACKAGE_DIR }}.zip.sha256
            ${{ env.GTT_PACKAGE_DIR }}.zip.verify.json
            ${{ env.GTT_PACKAGE_DIR }}.zip.trailer-editor-verify.json
            ${{ env.GTT_PACKAGE_DIR }}.zip.runner-bind.json
            ${{ env.GTT_PACKAGE_DIR }}.zip.human-review-packet.json
            ${{ env.GTT_PACKAGE_DIR }}\WIN64_ACCEPTANCE_SUMMARY.json
            ${{ env.GTT_PACKAGE_DIR }}\WIN64_CANDIDATE_ATTESTATION.json
            ${{ env.GTT_PACKAGE_DIR }}\FINAL_SHA256SUMS.txt
            ${{ env.GTT_PACKAGE_DIR }}\DEMO_TECHNICAL_GATE.json
            ${{ env.GTT_PACKAGE_DIR }}\DEMO_VISUAL_EVIDENCE.json
            ${{ env.GTT_PACKAGE_DIR }}\DemoVisualEvidence\GTT_visual_*.png
            ${{ env.GTT_QUALIFICATION_DIR }}\WIN64_RUNNER_QUALIFICATION.json
            ${{ env.GTT_QUALIFICATION_DIR }}\WIN64_RUNNER_QUALIFICATION.json.preflight.json
            ${{ env.GTT_QUALIFICATION_DIR }}\WIN64_RUNNER_QUALIFICATION.json.editor-probe.log
