name: GTT 0.1.59 heavy haul driving quality sanity

on:
  push:
    paths:
      - "Source/GTT/Private/Activities/GTTHeavyHaulDirector.cpp"
      - "Source/GTT/Public/Activities/GTTHeavyHaulDirector.h"
      - "Source/GTT/Private/Vehicles/GTTFarmTrailerDynamicsSubsystem.cpp"
      - "Source/GTT/Public/Vehicles/GTTFarmTrailerDynamicsSubsystem.h"
      - "Source/GTT/Private/Vehicles/GTTFieldmasterChaosMovementComponent.cpp"
      - "Source/GTT/Public/Vehicles/GTTFieldmasterChaosMovementComponent.h"
      - "Scripts/verify_v0_1_59_heavy_haul_driving_quality.py"
      - "Docs/PLAYTEST_0.1.59_HEAVY_HAUL_DRIVING_QUALITY.md"
      - "CHANGELOG.d/0.1.59-heavy-haul-driving-quality.md"
      - ".github/workflows/gtt-v0.1.59-heavy-haul-driving-quality.yml"
  pull_request:
    paths:
      - "Source/GTT/Private/Activities/GTTHeavyHaulDirector.cpp"
      - "Source/GTT/Public/Activities/GTTHeavyHaulDirector.h"
      - "Source/GTT/Private/Vehicles/GTTFarmTrailerDynamicsSubsystem.cpp"
      - "Source/GTT/Public/Vehicles/GTTFarmTrailerDynamicsSubsystem.h"
      - "Source/GTT/Private/Vehicles/GTTFieldmasterChaosMovementComponent.cpp"
      - "Source/GTT/Public/Vehicles/GTTFieldmasterChaosMovementComponent.h"
      - "Scripts/verify_v0_1_59_heavy_haul_driving_quality.py"
      - "Docs/PLAYTEST_0.1.59_HEAVY_HAUL_DRIVING_QUALITY.md"
      - "CHANGELOG.d/0.1.59-heavy-haul-driving-quality.md"
      - ".github/workflows/gtt-v0.1.59-heavy-haul-driving-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-heavy-haul-driving-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify 0.1.59 source and math contract
        run: python Scripts/verify_v0_1_59_heavy_haul_driving_quality.py
