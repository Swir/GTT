name: GTT 0.1.32 Farm Cargo breakdown recovery sanity

on:
  push:
    branches: [ main, 'milestone/**' ]
    paths:
      - 'Source/GTT/Public/Activities/GTTFarmCargoBreakdownRecoverySubsystem.h'
      - 'Source/GTT/Private/Activities/GTTFarmCargoBreakdownRecoverySubsystem.cpp'
      - 'Source/GTT/Public/Activities/GTTFarmCargoAuthoritySubsystem.h'
      - 'Source/GTT/Private/Activities/GTTFarmCargoAuthoritySubsystem.cpp'
      - 'Source/GTT/Public/Vehicles/GTTBreakdownDecisionSubsystem.h'
      - 'Source/GTT/Public/Vehicles/GTTRoadsideRecoverySubsystem.h'
      - 'Source/GTT/Private/Vehicles/GTTRoadsideRecoverySubsystem.cpp'
      - 'Source/GTT/Public/Vehicles/GTTVehicleIdentitySubsystem.h'
      - 'Source/GTT/Private/Vehicles/GTTVehicleIdentitySubsystem.cpp'
      - 'Scripts/verify_farm_cargo_breakdown_recovery.py'
      - 'Scripts/verify_farm_cargo_recovery.py'
      - 'Scripts/verify_farm_cargo_recovery_runtime.py'
      - 'Scripts/generate_progress_svg.py'
      - 'Docs/PLAYTEST_0.1.32.md'
      - 'Docs/ROADMAP.md'
      - 'README.md'
      - 'CHANGELOG.d/0.1.32.md'
      - 'assets/readme/progress-*.svg'
  pull_request:
    paths:
      - 'Source/GTT/Public/Activities/GTTFarmCargoBreakdownRecoverySubsystem.h'
      - 'Source/GTT/Private/Activities/GTTFarmCargoBreakdownRecoverySubsystem.cpp'
      - 'Source/GTT/Public/Activities/GTTFarmCargoAuthoritySubsystem.h'
      - 'Source/GTT/Private/Activities/GTTFarmCargoAuthoritySubsystem.cpp'
      - 'Source/GTT/Public/Vehicles/GTTBreakdownDecisionSubsystem.h'
      - 'Source/GTT/Public/Vehicles/GTTRoadsideRecoverySubsystem.h'
      - 'Source/GTT/Private/Vehicles/GTTRoadsideRecoverySubsystem.cpp'
      - 'Source/GTT/Public/Vehicles/GTTVehicleIdentitySubsystem.h'
      - 'Source/GTT/Private/Vehicles/GTTVehicleIdentitySubsystem.cpp'
      - 'Scripts/verify_farm_cargo_breakdown_recovery.py'
      - 'Scripts/verify_farm_cargo_recovery.py'
      - 'Scripts/verify_farm_cargo_recovery_runtime.py'
      - 'Scripts/generate_progress_svg.py'
      - 'Docs/PLAYTEST_0.1.32.md'
      - 'Docs/ROADMAP.md'
      - 'README.md'
      - 'CHANGELOG.d/0.1.32.md'
      - 'assets/readme/progress-*.svg'

permissions:
  contents: read

jobs:
  farm-cargo-breakdown-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve 0.1.30 persistent cargo recovery contract
        run: python3 Scripts/verify_farm_cargo_recovery.py
      - name: Preserve 0.1.31 packaged save/load cargo recovery contract
        run: python3 Scripts/verify_farm_cargo_recovery_runtime.py
      - name: Verify 0.1.32 cargo breakdown/tow recovery contract
        run: python3 Scripts/verify_farm_cargo_breakdown_recovery.py
      - name: Verify deterministic SWIR progress assets remain current
        run: python3 Scripts/generate_progress_svg.py --check
