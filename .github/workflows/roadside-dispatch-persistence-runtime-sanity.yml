name: GTT 0.1.40 roadside dispatch persistence runtime sanity

on:
  push:
    branches: [ main, 'milestone/**' ]
    paths:
      - 'Source/GTT/Public/Vehicles/GTTRoadsideDispatchPersistenceSubsystem.h'
      - 'Source/GTT/Private/Vehicles/GTTRoadsideDispatchPersistenceSubsystem.cpp'
      - 'Source/GTT/Public/Core/GTTFarmCargoDispatchPersistenceEvidenceSubsystem.h'
      - 'Source/GTT/Private/Core/GTTFarmCargoDispatchPersistenceEvidenceSubsystem.cpp'
      - 'Scripts/smoke_test_windows.ps1'
      - 'Scripts/evaluate_farm_cargo_dispatch_persistence_runtime.ps1'
      - 'Scripts/evaluate_demo_candidate.ps1'
      - 'Scripts/verify_roadside_dispatch_persistence_runtime.py'
      - '.github/workflows/win64-package-evidence.yml'
      - 'Docs/PLAYTEST_0.1.40.md'
      - 'CHANGELOG.d/0.1.40.md'
      - 'Docs/ROADMAP.md'
      - 'README.md'
      - 'assets/readme/progress-*.svg'
  pull_request:
    branches: [ main ]
    paths:
      - 'Source/GTT/Public/Vehicles/GTTRoadsideDispatchPersistenceSubsystem.h'
      - 'Source/GTT/Private/Vehicles/GTTRoadsideDispatchPersistenceSubsystem.cpp'
      - 'Source/GTT/Public/Core/GTTFarmCargoDispatchPersistenceEvidenceSubsystem.h'
      - 'Source/GTT/Private/Core/GTTFarmCargoDispatchPersistenceEvidenceSubsystem.cpp'
      - 'Scripts/smoke_test_windows.ps1'
      - 'Scripts/evaluate_farm_cargo_dispatch_persistence_runtime.ps1'
      - 'Scripts/evaluate_demo_candidate.ps1'
      - 'Scripts/verify_roadside_dispatch_persistence_runtime.py'
      - '.github/workflows/win64-package-evidence.yml'
      - 'Docs/PLAYTEST_0.1.40.md'
      - 'CHANGELOG.d/0.1.40.md'
      - 'Docs/ROADMAP.md'
      - 'README.md'
      - 'assets/readme/progress-*.svg'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch-persistence-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 0.1.39 persistence foundation remains intact
        run: python Scripts/verify_roadside_dispatch_persistence.py
      - name: Verify 0.1.40 packaged persistence evidence contract
        run: python Scripts/verify_roadside_dispatch_persistence_runtime.py
      - name: Verify deterministic SWIR progress presentation
        run: python Scripts/generate_progress_svg.py --check
