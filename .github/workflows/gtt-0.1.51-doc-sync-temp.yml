name: GTT 0.1.51 one-shot doc sync

on:
  push:
    branches:
      - milestone/0.1.51-workshop-priority-pickup
    paths:
      - '.github/workflows/gtt-0.1.51-doc-sync-temp.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone/0.1.51-workshop-priority-pickup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch README and roadmap from verified milestone truth
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roadmap_path = Path('Docs/ROADMAP.md')
          roadmap = roadmap_path.read_text(encoding='utf-8')
          assert '<!-- SWIR-ROADMAP-STANDARD:v1 -->' in roadmap
          assert roadmap.count('../assets/readme/progress-mini.svg') == 1
          assert '| **125** | **5** | **130** | **96.2%** |' in roadmap
          assert len(re.findall(r'^- \[x\] ', roadmap, flags=re.M | re.I)) == 125
          assert len(re.findall(r'^- \[ \] ', roadmap, flags=re.M)) == 5
          if '> **0.1.51 workshop priority, pickup and fleet return:**' not in roadmap:
              lines = roadmap.splitlines()
              idx = next(i for i, line in enumerate(lines) if line.startswith('> **0.1.50 workshop job board'))
              note = ('> **0.1.51 workshop priority, pickup and fleet return:** waiting STANDARD appointments can now be deliberately promoted before check-in through a separate exact-ID two-step priority desk. URGENT locks a deterministic +20% checkout quote, advances ahead of waiting STANDARD work where possible and shortens the existing workload-derived service timer to x0.80 without pre-charge. Successful timed checkout persists the exact paid/repaired vehicle as `READY_FOR_PICKUP`; the physical job board releases that exact vehicle back to the fleet, while garage dispatch shows PICKUP HOLD until collection. Additive SaveGame fields preserve priority/payment/pickup state, hard TOW/IMMOBILE WORKSHOP HOLD remains separate, and historical packaged workshop evidence auto-releases only through an evidence-only bridge using the production pickup API. This source milestone leaves all five Native Chaos, trailer and Win64 runtime/visual blockers unchanged.')
              lines[idx+1:idx+1] = ['', note]
              roadmap = '\n'.join(lines) + '\n'
          assert roadmap.count('../assets/readme/progress-mini.svg') == 1
          assert not re.search(r'[█▓▒░]{4,}|(?:\[[#=\-]{6,}\])', roadmap)
          roadmap_path.write_text(roadmap, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          assert '<!-- SWIR-README-STANDARD:v2 -->' in readme
          assert readme.count('assets/readme/progress-card.svg') == 1
          assert '## 🔎 Search Keywords' in readme
          readme = readme.replace(
              'Current development milestone: **0.1.50 — workshop job board and safe appointment control**.',
              'Current development milestone: **0.1.51 — workshop priority, pickup and fleet return**.'
          )
          if 'Milestone 0.1.51 adds deliberate workshop priority' not in readme:
              lines = readme.splitlines()
              idx = next(i for i, line in enumerate(lines) if line.startswith('Milestone 0.1.50 '))
              paragraph = ('Milestone 0.1.51 adds deliberate workshop priority and an explicit fleet-return handoff without creating a second economy authority. A separate exact-ID priority desk can promote a waiting STANDARD appointment to URGENT with a persisted +20% locked checkout quote and x0.80 service duration, always without pre-charge. After the existing timed service completes and the locked quote is paid once, the exact repaired vehicle remains `READY_FOR_PICKUP`; the job board releases it only when that exact vehicle is physically at the workshop, and numbered garage dispatch stays on PICKUP HOLD until collection. Legacy workshop evidence uses an evidence-only bridge that calls the same production pickup API rather than bypassing repair/payment logic.')
              lines[idx+1:idx+1] = ['', paragraph]
              readme = '\n'.join(lines) + '\n'
          old = 'Ordinary damaged/mobile native road vehicles can hold one of four persistent exact-ID appointments with locked quotes, timed 30–90 minute service, no pre-charge and a physical job board for lifecycle status plus guarded cancellation.'
          new = 'Ordinary damaged/mobile native road vehicles can hold one of four persistent exact-ID appointments with locked quotes, timed 30–90 minute service, no pre-charge, STANDARD/URGENT priority, a physical job board for lifecycle status/guarded cancellation, and explicit paid pickup before fleet redispatch.'
          if old in readme:
              readme = readme.replace(old, new, 1)
          assert 'Current development milestone: **0.1.51 — workshop priority, pickup and fleet return**.' in readme
          assert readme.count('assets/readme/progress-card.svg') == 1
          assert not re.search(r'[█▓▒░]{4,}|(?:\[[#=\-]{6,}\])', readme)
          readme_path.write_text(readme, encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit synchronized docs
        run: |
          rm .github/workflows/gtt-0.1.51-doc-sync-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md Docs/ROADMAP.md .github/workflows/gtt-0.1.51-doc-sync-temp.yml
          git diff --cached --check
          git commit -m 'Docs: sync GTT 0.1.51 README and roadmap'
          git push origin HEAD:milestone/0.1.51-workshop-priority-pickup
