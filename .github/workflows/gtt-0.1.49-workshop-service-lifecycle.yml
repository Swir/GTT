name: GTT 0.1.49 workshop service lifecycle sanity

on:
  push:
    branches: [ main, 'milestone/**' ]
    paths:
      - 'Source/GTT/Public/Save/GTTWorkshopQueueSaveGame.h'
      - 'Source/GTT/Public/World/GTTWorkshopRepairQueueSubsystem.h'
      - 'Source/GTT/Private/World/GTTWorkshopRepairQueueSubsystem.cpp'
      - 'Source/GTT/Private/Core/GTTWorkshopCapacityRuntimeEvidenceSubsystem.cpp'
      - 'Scripts/verify_workshop_service_lifecycle.py'
      - 'Scripts/verify_workshop_multi_vehicle_capacity.py'
      - 'Scripts/verify_workshop_capacity_runtime.py'
      - 'Docs/PLAYTEST_0.1.49.md'
      - 'CHANGELOG.d/0.1.49.md'
      - 'Docs/ROADMAP.md'
      - 'README.md'
      - 'assets/readme/progress-*.svg'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 0.1.47 multi-vehicle capacity regression contract
        run: python Scripts/verify_workshop_multi_vehicle_capacity.py
      - name: Verify 0.1.48 packaged capacity evidence source contract
        run: python Scripts/verify_workshop_capacity_runtime.py
      - name: Verify 0.1.49 timed workshop service lifecycle
        run: python Scripts/verify_workshop_service_lifecycle.py
      - name: Verify deterministic SWIR progress presentation
        run: python Scripts/generate_progress_svg.py --check
