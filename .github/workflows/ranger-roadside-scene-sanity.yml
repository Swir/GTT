name: GTT 0.1.25 physical shoulder pull-over and patrol scene sanity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ranger-roadside-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify previous enforcement UX / civilian / traffic contract
        run: python Scripts/verify_ranger_enforcement_ux.py
      - name: Verify physical shoulder pull-over and warden patrol scene
        run: python Scripts/verify_ranger_roadside_scene.py