name: GTT 0.1.17 deterministic drivetrain sanity
on:
  push: { branches: [ main ] }
  pull_request: { branches: [ main ] }
  workflow_dispatch:
jobs:
  deterministic-drivetrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Verify deterministic packaged drivetrain scenario
        run: python Scripts/verify_deterministic_drivetrain_scenario.py
      - name: Regression — automatic drivetrain authority
        run: python Scripts/verify_automatic_drivetrain_runtime.py
      - name: Regression — packaged Native Chaos telemetry
        run: python Scripts/verify_native_runtime_telemetry.py
      - name: Regression — deterministic packaged demo scenario
        run: python Scripts/verify_deterministic_demo_scenario.py
