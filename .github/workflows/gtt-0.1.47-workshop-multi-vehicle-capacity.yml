name: GTT 0.1.47 workshop multi-vehicle capacity sanity

on:
  push:
    branches: [ main, 'milestone/**' ]
    paths:
      - 'Source/GTT/Public/Save/GTTWorkshopQueueSaveGame.h'
      - 'Source/GTT/Public/World/GTTWorkshopRepairQueueSubsystem.h'
      - 'Source/GTT/Private/World/GTTWorkshopRepairQueueSubsystem.cpp'
      - 'Source/GTT/Private/World/GTTGarageTerminal.cpp'
      - 'Source/GTT/Private/Core/GTTWorkshopQueueRuntimeEvidenceSubsystem.cpp'
      - 'Scripts/verify_workshop_multi_vehicle_capacity.py'
      - 'Scripts/verify_workshop_repair_queue.py'
      - 'Scripts/verify_workshop_queue_runtime.py'
      - 'Docs/PLAYTEST_0.1.47.md'
      - 'CHANGELOG.d/0.1.47.md'
      - 'Docs/ROADMAP.md'
      - 'README.md'
      - 'assets/readme/progress-*.svg'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 0.1.45 deferred repair invariants
        run: python Scripts/verify_workshop_repair_queue.py
      - name: Verify 0.1.46 packaged single-appointment evidence compatibility
        run: python Scripts/verify_workshop_queue_runtime.py
      - name: Verify 0.1.47 multi-vehicle capacity and non-blocking economy
        run: python Scripts/verify_workshop_multi_vehicle_capacity.py
      - name: Verify deterministic SWIR progress presentation
        run: python Scripts/generate_progress_svg.py --check
