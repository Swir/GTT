name: SWIR Progress SVG PRO sanity
on:
  push:
    branches: [main]
    paths:
      - 'Docs/ROADMAP.md'
      - 'README.md'
      - 'assets/readme/progress-*.svg'
      - 'Scripts/generate_progress_svg.py'
      - '.github/workflows/progress-svg-sanity.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Docs/ROADMAP.md'
      - 'README.md'
      - 'assets/readme/progress-*.svg'
      - 'Scripts/generate_progress_svg.py'
      - '.github/workflows/progress-svg-sanity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  progress-svg:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify deterministic roadmap-derived SVGs
        run: python Scripts/generate_progress_svg.py --check
