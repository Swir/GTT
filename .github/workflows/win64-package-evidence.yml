name: Win64 package evidence

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact GTT candidate version; must match Config/DefaultGame.ini ProjectVersion'
        required: true
        default: '0.1.69'
      configuration:
        description: 'Unreal build configuration'
        required: true
        type: choice
        options: [Shipping, Development]
        default: Shipping
      engine_root:
        description: 'UE 5.8 installation root on the self-hosted runner'
        required: true
        default: 'C:\Program Files\Epic Games\UE_5.8'

permissions:
  contents: read

concurrency:
  group: gtt-win64-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-and-smoke:
    name: UE 5.8 Win64 sealed candidate + runtime + rendered evidence
    runs-on: [self-hosted, windows, x64, unreal-5.8]
    timeout-minutes: 125
    env:
      GTT_VERSION: ${{ inputs.version }}
      GTT_CONFIGURATION: ${{ inputs.configuration }}
      GTT_ENGINE_ROOT: ${{ inputs.engine_root }}
      GTT_PACKAGE_DIR: ${{ github.workspace }}\Releases\GTT-${{ inputs.version }}-Windows-${{ inputs.configuration }}
      GTT_RUNNER_QUALIFICATION_DIR: ${{ github.workspace }}\Saved\RunnerQualification
      GTT_RUNNER_QUALIFICATION_PATH: ${{ github.workspace }}\Saved\RunnerQualification\WIN64_RUNNER_QUALIFICATION.json
    steps:
      - name: Checkout exact source and LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Validate explicit candidate version against project metadata
        shell: pwsh
        run: |
          $ini = Get-Content -Raw "${{ github.workspace }}\Config\DefaultGame.ini"
          $match = [regex]::Match($ini, '(?m)^ProjectVersion=(.+)$')
          if (-not $match.Success) { throw "ProjectVersion is missing from Config/DefaultGame.ini." }
          $projectVersion = $match.Groups[1].Value.Trim()
          if ([string]::IsNullOrWhiteSpace($env:GTT_VERSION)) { throw "Candidate version input must not be empty." }
          if ($env:GTT_VERSION -ne $projectVersion) { throw "Candidate version '$env:GTT_VERSION' does not match ProjectVersion '$projectVersion'." }

      - name: Qualify exact UE 5.8 Win64 runner before candidate work
        shell: pwsh
        run: >-
          ./Scripts/qualify_win64_runner.ps1
          -EngineRoot "$env:GTT_ENGINE_ROOT"
          -OutputPath "$env:GTT_RUNNER_QUALIFICATION_PATH"
          -ExpectedGitSha "${{ github.sha }}"
          -ExpectedVersion "$env:GTT_VERSION"

      - name: Verify exact runner qualification evidence
        shell: pwsh
        run: |
          if (-not (Test-Path $env:GTT_RUNNER_QUALIFICATION_PATH -PathType Leaf)) {
            throw "Runner qualification evidence missing: $env:GTT_RUNNER_QUALIFICATION_PATH"
          }
          $qualification = Get-Content -Raw $env:GTT_RUNNER_QUALIFICATION_PATH | ConvertFrom-Json
          if ($qualification.schema -ne 'gtt.win64-runner-qualification.v1') { throw 'Unexpected runner qualification schema.' }
          if ($qualification.result -ne 'PASS') { throw 'UE 5.8 Win64 runner qualification did not PASS.' }
          if ($qualification.git_sha -ne '${{ github.sha }}') { throw 'Runner qualification SHA does not match exact candidate.' }
          if ($qualification.version -ne $env:GTT_VERSION) { throw 'Runner qualification version does not match exact candidate.' }
          if ($qualification.engine -ne 'Unreal Engine 5.8') { throw 'Runner qualification engine identity mismatch.' }
          if ($qualification.preflight -ne 'PASS') { throw 'Runner qualification UE/Win64 preflight did not PASS.' }
          if ($qualification.editor_build -ne 'PASS') { throw 'Runner qualification GTTEditor build did not PASS.' }
          if ($qualification.editor_probe -ne 'PASS') { throw 'Runner qualification UnrealEditor-Cmd probe did not PASS.' }
          if ($qualification.human_visual_review -ne 'REQUIRED' -or [bool]$qualification.demo_release_authorized) {
            throw 'Runner qualification crossed the technical/human release boundary.'
          }

      - name: Run sealed exact-candidate acceptance
        shell: pwsh
        run: >-
          ./Scripts/run_win64_attested_candidate_acceptance.ps1
          -EngineRoot "$env:GTT_ENGINE_ROOT"
          -Configuration "$env:GTT_CONFIGURATION"
          -Version "$env:GTT_VERSION"
          -PackageDirectory "$env:GTT_PACKAGE_DIR"

      - name: Verify sealed candidate evidence
        shell: pwsh
        run: |
          $summaryPath = Join-Path $env:GTT_PACKAGE_DIR 'WIN64_ACCEPTANCE_SUMMARY.json'
          $attestationPath = Join-Path $env:GTT_PACKAGE_DIR 'WIN64_CANDIDATE_ATTESTATION.json'
          $hillHaulPath = Join-Path $env:GTT_PACKAGE_DIR 'FIELDMASTER_HILL_HAUL_RUNTIME.json'
          $authorityPath = Join-Path $env:GTT_PACKAGE_DIR 'NATIVE_AUTHORITY_RUNTIME.json'
          $manifestPath = Join-Path $env:GTT_PACKAGE_DIR 'FINAL_SHA256SUMS.txt'
          $zipPath = "$env:GTT_PACKAGE_DIR.zip"
          $zipHashPath = "$zipPath.sha256"

          foreach ($path in @($summaryPath,$attestationPath,$hillHaulPath,$authorityPath,$manifestPath,$zipPath,$zipHashPath,$env:GTT_RUNNER_QUALIFICATION_PATH)) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Required sealed candidate artifact missing: $path" }
          }

          $summary = Get-Content -Raw $summaryPath | ConvertFrom-Json
          $attestation = Get-Content -Raw $attestationPath | ConvertFrom-Json
          $hillHaul = Get-Content -Raw $hillHaulPath | ConvertFrom-Json
          $authority = Get-Content -Raw $authorityPath | ConvertFrom-Json
          $qualification = Get-Content -Raw $env:GTT_RUNNER_QUALIFICATION_PATH | ConvertFrom-Json

          foreach ($doc in @($summary,$attestation,$hillHaul,$authority,$qualification)) {
            if ($doc.result -ne 'PASS' -or $doc.git_sha -ne '${{ github.sha }}') { throw 'Candidate evidence identity/result mismatch.' }
            if (($doc.PSObject.Properties.Name -contains 'version') -and $doc.version -ne $env:GTT_VERSION) { throw 'Candidate evidence version mismatch.' }
          }

          if ($qualification.preflight -ne 'PASS' -or $qualification.editor_build -ne 'PASS' -or $qualification.editor_probe -ne 'PASS' -or $qualification.human_visual_review -ne 'REQUIRED' -or [bool]$qualification.demo_release_authorized) { throw 'Runner qualification evidence is incomplete or crossed the release boundary.' }
          if ($summary.configuration -ne $env:GTT_CONFIGURATION -or $summary.fieldmaster_hill_haul_runtime -ne 'PASS' -or $summary.human_visual_review -ne 'REQUIRED' -or [bool]$summary.demo_release_authorized) { throw 'Acceptance summary crossed the technical/human review boundary.' }
          if ($attestation.schema -ne 'gtt.win64-candidate-attestation.v1' -or $attestation.configuration -ne $env:GTT_CONFIGURATION -or $attestation.fieldmaster_hill_haul_runtime -ne 'PASS' -or [int]$attestation.hill_haul_loaded_samples -lt 2 -or [int]$attestation.hill_haul_assist_samples -lt 1 -or [int]$attestation.hill_haul_thermal_samples -lt 1 -or [int]$attestation.technical_gate_schema -ne 17 -or $attestation.human_visual_review -ne 'REQUIRED' -or [bool]$attestation.demo_release_authorized) { throw 'Sealed candidate attestation is incomplete or crossed the release boundary.' }
          if ($authority.authority -ne 'NATIVE_CHAOS' -or [int]$authority.authority_faults -ne 0) { throw 'Native authority evidence is not clean NATIVE_CHAOS.' }
          if ([int]$hillHaul.loaded_trailer_samples -lt 2 -or [int]$hillHaul.assist_samples -lt 1 -or [int]$hillHaul.thermal_samples -lt 1) { throw 'Hill-haul runtime evidence lacks required loaded/assist/thermal coverage.' }

          $manifestLines = @(Get-Content $manifestPath | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($manifestLines.Count -lt 20) { throw 'Final integrity manifest is unexpectedly small.' }
          foreach ($line in $manifestLines) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Malformed final manifest line: $line" }
            $relative = $Matches[2]
            $path = Join-Path $env:GTT_PACKAGE_DIR ($relative.Replace('/','\'))
            if (-not (Test-Path $path -PathType Leaf)) { throw "Final manifest references missing file: $relative" }
            $actual = (Get-FileHash -Algorithm SHA256 -Path $path).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1]) { throw "Final manifest hash mismatch: $relative" }
          }
          $expectedZipHash = ((Get-Content -Raw $zipHashPath).Trim() -split '\s+')[0].ToLowerInvariant()
          $actualZipHash = (Get-FileHash -Algorithm SHA256 -Path $zipPath).Hash.ToLowerInvariant()
          if ($actualZipHash -ne $expectedZipHash) { throw 'Candidate ZIP SHA256 mismatch.' }

      - name: Upload sealed Win64 evidence
        uses: actions/upload-artifact@v4
        with:
          name: GTT-${{ inputs.version }}-Win64-technical-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.GTT_PACKAGE_DIR }}.zip
            ${{ env.GTT_PACKAGE_DIR }}.zip.sha256
            ${{ env.GTT_PACKAGE_DIR }}\WIN64_ACCEPTANCE_SUMMARY.json
            ${{ env.GTT_PACKAGE_DIR }}\WIN64_CANDIDATE_ATTESTATION.json
            ${{ env.GTT_PACKAGE_DIR }}\FINAL_SHA256SUMS.txt
            ${{ env.GTT_PACKAGE_DIR }}\AUTHORED_TRAILER_IMPORT.json
            ${{ env.GTT_PACKAGE_DIR }}\NATIVE_AUTHORITY_RUNTIME.json
            ${{ env.GTT_PACKAGE_DIR }}\FIELDMASTER_HILL_HAUL_RUNTIME.json
            ${{ env.GTT_PACKAGE_DIR }}\NATIVE_CHAOS_RUNTIME.json
            ${{ env.GTT_PACKAGE_DIR }}\NATIVE_TRAILER_RUNTIME.json
            ${{ env.GTT_PACKAGE_DIR }}\DEMO_TECHNICAL_GATE.json
            ${{ env.GTT_PACKAGE_DIR }}\DEMO_VISUAL_EVIDENCE.json
            ${{ env.GTT_PACKAGE_DIR }}\DemoVisualEvidence\GTT_visual_*.png
            ${{ env.GTT_RUNNER_QUALIFICATION_DIR }}\**

      - name: Upload Win64 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GTT-${{ inputs.version }}-Win64-failure-diagnostics
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ env.GTT_PACKAGE_DIR }}\*.json
            ${{ env.GTT_PACKAGE_DIR }}\*.log
            ${{ env.GTT_PACKAGE_DIR }}\DemoVisualEvidence\*.png
            ${{ env.GTT_RUNNER_QUALIFICATION_DIR }}\**
            ${{ github.workspace }}\Releases\*.json
            ${{ github.workspace }}\Saved\Logs\**

