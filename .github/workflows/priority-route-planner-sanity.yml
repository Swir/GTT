name: GTT 0.1.12 priority route planner sanity

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  priority-route-planner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify priority route planner and consequence ledger
        run: python Scripts/verify_priority_route_planner.py
