name: GTT 0.1.28 farm cargo authority and progress sanity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  farm-cargo-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify previous demo vertical slice
        run: python Scripts/verify_demo_vertical_slice.py
      - name: Verify deterministic SWIR progress SVG outputs
        run: python Scripts/generate_progress_svg.py --check
      - name: Verify 0.1.28 physical cargo vehicle authority
        run: python Scripts/verify_farm_cargo_authority.py
