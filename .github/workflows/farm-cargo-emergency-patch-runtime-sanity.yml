name: GTT 0.1.35 Farm Cargo emergency patch runtime sanity

on:
  push:
    branches: [ main, 'milestone/**' ]
    paths:
      - 'Source/GTT/Public/Core/GTTFarmCargoBreakdownEvidenceSubsystem.h'
      - 'Source/GTT/Private/Core/GTTFarmCargoBreakdownEvidenceSubsystem.cpp'
      - 'Source/GTT/Private/Activities/GTTFarmCargoBreakdownRecoverySubsystem.cpp'
      - 'Source/GTT/Private/Vehicles/GTTRoadsideRecoverySubsystem.cpp'
      - 'Scripts/evaluate_farm_cargo_breakdown_runtime.ps1'
      - 'Scripts/evaluate_demo_candidate.ps1'
      - 'Scripts/verify_farm_cargo_breakdown_runtime.py'
      - 'Scripts/verify_farm_cargo_emergency_patch_runtime.py'
      - 'Scripts/generate_progress_svg.py'
      - '.github/workflows/win64-package-evidence.yml'
      - 'Docs/PLAYTEST_0.1.35.md'
      - 'Docs/ROADMAP.md'
      - 'README.md'
      - 'CHANGELOG.d/0.1.35.md'
      - 'assets/readme/progress-*.svg'
  pull_request:
    branches: [ main ]
    paths:
      - 'Source/GTT/Public/Core/GTTFarmCargoBreakdownEvidenceSubsystem.h'
      - 'Source/GTT/Private/Core/GTTFarmCargoBreakdownEvidenceSubsystem.cpp'
      - 'Source/GTT/Private/Activities/GTTFarmCargoBreakdownRecoverySubsystem.cpp'
      - 'Source/GTT/Private/Vehicles/GTTRoadsideRecoverySubsystem.cpp'
      - 'Scripts/evaluate_farm_cargo_breakdown_runtime.ps1'
      - 'Scripts/evaluate_demo_candidate.ps1'
      - 'Scripts/verify_farm_cargo_breakdown_runtime.py'
      - 'Scripts/verify_farm_cargo_emergency_patch_runtime.py'
      - 'Scripts/generate_progress_svg.py'
      - '.github/workflows/win64-package-evidence.yml'
      - 'Docs/PLAYTEST_0.1.35.md'
      - 'Docs/ROADMAP.md'
      - 'README.md'
      - 'CHANGELOG.d/0.1.35.md'
      - 'assets/readme/progress-*.svg'

permissions:
  contents: read

jobs:
  farm-cargo-emergency-patch-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Preserve 0.1.33 breakdown/tow evidence guarantees
        run: python3 Scripts/verify_farm_cargo_breakdown_runtime.py
      - name: Preserve 0.1.34 production emergency-patch/cargo policy
        run: python3 Scripts/verify_roadside_patch_cargo_recovery.py
      - name: Verify 0.1.35 emergency-patch packaged-runtime contract
        run: python3 Scripts/verify_farm_cargo_emergency_patch_runtime.py
      - name: Verify deterministic SWIR progress assets remain current
        run: python3 Scripts/generate_progress_svg.py --check
