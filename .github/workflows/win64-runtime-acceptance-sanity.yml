name: GTT 0.1.15 Native Chaos runtime telemetry sanity

on:
  push:
    branches: [main]
    paths:
      - 'Source/GTT/Public/Vehicles/GTTFieldmasterChaosMovementComponent.h'
      - 'Source/GTT/Private/Vehicles/GTTFieldmasterChaosMovementComponent.cpp'
      - 'Source/GTT/Private/Core/GTTDemoSmokeScenarioSubsystem.cpp'
      - 'Scripts/preflight_win64_unreal.ps1'
      - 'Scripts/package_windows.ps1'
      - 'Scripts/validate_windows_package.ps1'
      - 'Scripts/evaluate_fieldmaster_chaos_telemetry.ps1'
      - 'Scripts/test_fieldmaster_chaos_telemetry.ps1'
      - 'Scripts/evaluate_demo_candidate.ps1'
      - 'Scripts/verify_fieldmaster_runtime_telemetry.py'
      - 'Scripts/verify_win64_evidence_pipeline.py'
      - '.github/workflows/win64-package-evidence.yml'
      - '.github/workflows/release-windows.yml'
      - '.github/workflows/win64-runtime-acceptance-sanity.yml'
      - 'Docs/RELEASE_WINDOWS.md'
      - 'Docs/PLAYTEST_0.1.15.md'
      - 'GTT.uproject'
  pull_request:
    branches: [main]
    paths:
      - 'Source/GTT/Public/Vehicles/GTTFieldmasterChaosMovementComponent.h'
      - 'Source/GTT/Private/Vehicles/GTTFieldmasterChaosMovementComponent.cpp'
      - 'Source/GTT/Private/Core/GTTDemoSmokeScenarioSubsystem.cpp'
      - 'Scripts/preflight_win64_unreal.ps1'
      - 'Scripts/package_windows.ps1'
      - 'Scripts/validate_windows_package.ps1'
      - 'Scripts/evaluate_fieldmaster_chaos_telemetry.ps1'
      - 'Scripts/test_fieldmaster_chaos_telemetry.ps1'
      - 'Scripts/evaluate_demo_candidate.ps1'
      - 'Scripts/verify_fieldmaster_runtime_telemetry.py'
      - 'Scripts/verify_win64_evidence_pipeline.py'
      - '.github/workflows/win64-package-evidence.yml'
      - '.github/workflows/release-windows.yml'
      - '.github/workflows/win64-runtime-acceptance-sanity.yml'
      - 'Docs/RELEASE_WINDOWS.md'
      - 'Docs/PLAYTEST_0.1.15.md'
      - 'GTT.uproject'

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Verify dedicated Fieldmaster Native Chaos runtime telemetry contract
        run: python Scripts/verify_fieldmaster_runtime_telemetry.py
      - name: Exercise Fieldmaster telemetry evaluator with positive and negative fixtures
        shell: pwsh
        run: ./Scripts/test_fieldmaster_chaos_telemetry.ps1
      - name: Verify Win64 runtime acceptance evidence contract
        run: python Scripts/verify_win64_evidence_pipeline.py
      - name: Verify existing dedicated Fieldmaster Chaos movement contract
        run: python Scripts/verify_fieldmaster_dedicated_chaos_movement.py
