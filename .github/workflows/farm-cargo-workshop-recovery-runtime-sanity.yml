name: GTT 0.1.42 packaged workshop recovery sanity

on:
  push:
    branches: [ main, 'milestone/**' ]
    paths:
      - 'Source/GTT/Public/Core/GTTFarmCargoWorkshopRecoveryEvidenceSubsystem.h'
      - 'Source/GTT/Private/Core/GTTFarmCargoWorkshopRecoveryEvidenceSubsystem.cpp'
      - 'Source/GTT/Public/World/GTTServiceTerminal.h'
      - 'Source/GTT/Private/World/GTTServiceTerminal.cpp'
      - 'Source/GTT/Public/World/GTTGarageFleetSubsystem.h'
      - 'Source/GTT/Private/World/GTTGarageSlotTerminal.cpp'
      - 'Source/GTT/Private/Vehicles/GTTRoadsideRecoverySubsystem.cpp'
      - 'Scripts/smoke_test_windows.ps1'
      - 'Scripts/evaluate_farm_cargo_workshop_recovery_runtime.ps1'
      - 'Scripts/promote_demo_gate_workshop_recovery.ps1'
      - 'Scripts/verify_farm_cargo_workshop_recovery_runtime.py'
      - '.github/workflows/win64-package-evidence.yml'
      - 'Docs/PLAYTEST_0.1.42.md'
      - 'CHANGELOG.d/0.1.42.md'
      - 'Docs/ROADMAP.md'
      - 'README.md'
      - 'assets/readme/progress-*.svg'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 0.1.41 garage/workshop gameplay foundation
        run: python Scripts/verify_garage_workshop_recovery.py
      - name: Verify 0.1.42 packaged workshop recovery evidence contract
        run: python Scripts/verify_farm_cargo_workshop_recovery_runtime.py
      - name: Verify deterministic SWIR progress presentation
        run: python Scripts/generate_progress_svg.py --check
