name: GTT 0.1.63 Trailer brake thermal control sanity

on:
  push:
    branches: [ main, 'milestone/0.1.63-trailer-brake-thermal-control' ]
    paths:
      - 'Source/GTT/Public/Vehicles/GTTFieldmasterChaosMovementComponent.h'
      - 'Source/GTT/Private/Vehicles/GTTFieldmasterChaosMovementComponent.cpp'
      - 'Scripts/verify_v0_1_63_trailer_brake_thermal_control.py'
      - 'Docs/PLAYTEST-0.1.63-TRAILER-BRAKE-THERMAL.md'
      - 'CHANGELOG.d/0.1.63-trailer-brake-thermal-control.md'
      - '.github/workflows/trailer-brake-thermal-control-sanity.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Source/GTT/Public/Vehicles/GTTFieldmasterChaosMovementComponent.h'
      - 'Source/GTT/Private/Vehicles/GTTFieldmasterChaosMovementComponent.cpp'
      - 'Scripts/verify_v0_1_63_trailer_brake_thermal_control.py'
      - 'Docs/PLAYTEST-0.1.63-TRAILER-BRAKE-THERMAL.md'
      - 'CHANGELOG.d/0.1.63-trailer-brake-thermal-control.md'
      - '.github/workflows/trailer-brake-thermal-control-sanity.yml'
  workflow_dispatch:

jobs:
  trailer-brake-thermal-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Verify 0.1.63 trailer brake thermal source and math
        run: python Scripts/verify_v0_1_63_trailer_brake_thermal_control.py
      - name: Preserve 0.1.62 hill-haul contract
        run: python Scripts/verify_v0_1_62_fieldmaster_hill_haul_control.py
      - name: Preserve 0.1.59 heavy-haul authority contract
        run: python Scripts/verify_v0_1_59_heavy_haul_driving_quality.py
      - name: Preserve final drivetrain authority contract
        run: python Scripts/verify_native_drivetrain_authority.py
      - name: Preserve project sanity
        run: python Scripts/verify_project.py
