name: GTT 0.1.55 civilian responder handoff sanity

on:
  push:
    branches:
      - main
      - "milestone/**"
    paths:
      - "Source/GTT/Public/Traffic/GTTCivilianIncidentResponderSubsystem.h"
      - "Source/GTT/Private/Traffic/GTTCivilianIncidentResponderSubsystem.cpp"
      - "Source/GTT/Public/Traffic/GTTRoadsideResponderVehicle.h"
      - "Source/GTT/Private/Traffic/GTTRoadsideResponderVehicle.cpp"
      - "Source/GTT/Public/Traffic/GTTTrafficCarPawn.h"
      - "Source/GTT/Private/Traffic/GTTTrafficCarPawn.cpp"
      - "Source/GTT/Public/Save/GTTCivilianResponderSaveGame.h"
      - "Scripts/verify_0_1_55_civilian_responder_handoff.py"
      - "Scripts/verify_0_1_54_civilian_incident_dispatch.py"
      - "Scripts/verify_0_1_53_roadside_assistance.py"
      - "Docs/PLAYTEST-0.1.55.md"
      - "CHANGELOG.d/0.1.55-civilian-responder-handoff.md"
      - ".github/workflows/gtt-0.1.55-civilian-responder-handoff.yml"
  pull_request:
    paths:
      - "Source/GTT/Public/Traffic/GTTCivilianIncidentResponderSubsystem.h"
      - "Source/GTT/Private/Traffic/GTTCivilianIncidentResponderSubsystem.cpp"
      - "Source/GTT/Public/Traffic/GTTRoadsideResponderVehicle.h"
      - "Source/GTT/Private/Traffic/GTTRoadsideResponderVehicle.cpp"
      - "Source/GTT/Public/Traffic/GTTTrafficCarPawn.h"
      - "Source/GTT/Private/Traffic/GTTTrafficCarPawn.cpp"
      - "Source/GTT/Public/Save/GTTCivilianResponderSaveGame.h"
      - "Scripts/verify_0_1_55_civilian_responder_handoff.py"
      - "Scripts/verify_0_1_54_civilian_incident_dispatch.py"
      - "Scripts/verify_0_1_53_roadside_assistance.py"
      - "Docs/PLAYTEST-0.1.55.md"
      - "CHANGELOG.d/0.1.55-civilian-responder-handoff.md"
      - ".github/workflows/gtt-0.1.55-civilian-responder-handoff.yml"

permissions:
  contents: read

jobs:
  civilian-responder-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify 0.1.55 responder handoff contract
        run: python Scripts/verify_0_1_55_civilian_responder_handoff.py

      - name: Re-run 0.1.54 civilian dispatch regression contract
        run: python Scripts/verify_0_1_54_civilian_incident_dispatch.py

      - name: Re-run 0.1.53 roadside assistance regression contract
        run: python Scripts/verify_0_1_53_roadside_assistance.py
