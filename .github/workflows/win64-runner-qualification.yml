name: GTT Win64 UE 5.8 runner qualification

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact project version to qualify; must match Config/DefaultGame.ini'
        required: true
        default: '0.1.69'
      engine_root:
        description: 'UE 5.8 installation root on the qualifying self-hosted runner'
        required: true
        default: 'C:\Program Files\Epic Games\UE_5.8'
      minimum_free_gib:
        description: 'Minimum free disk space required for the later full candidate run'
        required: true
        default: '25'
  push:
    branches:
      - qualification/0.1.69-runner-probe

permissions:
  actions: write
  contents: read

concurrency:
  # One global lane across all versioned qualification probes. A newer exact
  # candidate must supersede any older queued/in-progress probe before a real
  # UE 5.8 runner becomes available, otherwise stale work can consume it first.
  group: gtt-win64-runner-qualification
  cancel-in-progress: true

jobs:
  probe-contract:
    name: Verify qualification dispatch contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GTT_EXPECTED_VERSION: ${{ inputs.version || '0.1.69' }}
      GTT_PROBE_DIR: ${{ github.workspace }}/Saved/Win64/RunnerQualificationProbe
    steps:
      - name: Cancel legacy stale qualification runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GTT_REPOSITORY: ${{ github.repository }}
          GTT_CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repository = os.environ["GTT_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          current_run_id = int(os.environ["GTT_CURRENT_RUN_ID"])
          workflow_path = ".github/workflows/win64-runner-qualification.yml"
          runs_url = f"https://api.github.com/repos/{repository}/actions/runs?status=queued&per_page=100"

          def request_json(url: str):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          def cancel_run(run_id: int) -> None:
              url = f"https://api.github.com/repos/{repository}/actions/runs/{run_id}/cancel"
              req = urllib.request.Request(
                  url,
                  data=b"",
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      if response.status not in (202, 204):
                          raise RuntimeError(f"unexpected cancellation status {response.status} for run {run_id}")
              except urllib.error.HTTPError as exc:
                  # 409 is only tolerable when another actor/concurrency transition
                  # already removed the run from the queued set; final re-query below
                  # remains authoritative and fails closed otherwise.
                  if exc.code != 409:
                      raise

          def stale_legacy_runs():
              payload = request_json(runs_url)
              result = []
              for run in payload.get("workflow_runs", []):
                  run_id = int(run.get("id", 0))
                  if run.get("path") != workflow_path:
                      continue
                  if run.get("status") != "queued":
                      continue
                  if run_id >= current_run_id:
                      continue
                  result.append(run)
              return result

          stale = stale_legacy_runs()
          cancelled = []
          for run in stale:
              run_id = int(run["id"])
              cancel_run(run_id)
              cancelled.append(run_id)
              print(
                  "Requested cancellation of stale qualification run "
                  f"{run_id} ({run.get('head_branch')} @ {run.get('head_sha')})."
              )

          remaining = stale_legacy_runs()
          if remaining:
              ids = ", ".join(str(run["id"]) for run in remaining)
              raise RuntimeError(f"stale queued qualification runs remain after cleanup: {ids}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(
                  "GTT_CANCELLED_STALE_QUALIFICATION_RUNS="
                  + ",".join(str(run_id) for run_id in cancelled)
                  + "\n"
              )
          print(f"Legacy qualification queue clear; cancelled={cancelled}")
          PY

      - name: Checkout exact probe source
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Verify exact source, version and qualification entrypoint
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "${GITHUB_SHA}" ]]; then
            echo "Expected workflow SHA ${GITHUB_SHA}, got ${actual_sha}." >&2
            exit 1
          fi

          actual_version="$(awk -F= '/^ProjectVersion=/{gsub(/\r/,"",$2); print $2; exit}' Config/DefaultGame.ini)"
          if [[ -z "$actual_version" || "$actual_version" != "$GTT_EXPECTED_VERSION" ]]; then
            echo "Expected project version ${GTT_EXPECTED_VERSION}, got ${actual_version:-missing}." >&2
            exit 1
          fi

          test -f GTT.uproject
          test -f Scripts/qualify_win64_runner.ps1
          test -f .github/workflows/win64-runner-qualification.yml

          mkdir -p "$GTT_PROBE_DIR"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          cancelled = [
              int(value)
              for value in os.environ.get("GTT_CANCELLED_STALE_QUALIFICATION_RUNS", "").split(",")
              if value.strip()
          ]
          payload = {
              "schema": "gtt.win64.runner-dispatch-probe.v1",
              "git_sha": os.environ["GITHUB_SHA"],
              "git_ref": os.environ["GITHUB_REF"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "expected_project_version": os.environ["GTT_EXPECTED_VERSION"],
              "required_runner_labels": ["self-hosted", "windows", "x64", "unreal-5.8"],
              "hosted_dispatch_contract_verified": True,
              "legacy_stale_queue_clear": True,
              "cancelled_stale_qualification_run_ids": cancelled,
              "self_hosted_runner_qualified": False,
              "demo_release_authorized": False,
              "human_visual_review": "REQUIRED",
          }
          out = Path(os.environ["GTT_PROBE_DIR"]) / "WIN64_RUNNER_DISPATCH_PROBE.json"
          out.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Upload dispatch probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: GTT-Win64-runner-dispatch-probe-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ env.GTT_PROBE_DIR }}/WIN64_RUNNER_DISPATCH_PROBE.json

  qualification-only:
    name: Qualify self-hosted Windows x64 + Unreal Engine 5.8 runner
    needs: probe-contract
    runs-on: [self-hosted, windows, x64, unreal-5.8]
    timeout-minutes: 12
    env:
      GTT_ENGINE_ROOT: ${{ inputs.engine_root || 'C:\Program Files\Epic Games\UE_5.8' }}
      GTT_EXPECTED_VERSION: ${{ inputs.version || '0.1.69' }}
      GTT_MINIMUM_FREE_GIB: ${{ inputs.minimum_free_gib || '25' }}
      GTT_QUALIFICATION_DIR: ${{ github.workspace }}\Saved\Win64\RunnerQualification
    steps:
      - name: Checkout exact source and LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Qualify runner and project bootstrap
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GTT_QUALIFICATION_DIR" | Out-Null
          ./Scripts/qualify_win64_runner.ps1 `
            -EngineRoot "$env:GTT_ENGINE_ROOT" `
            -ProjectFile "${{ github.workspace }}\GTT.uproject" `
            -OutputPath "$env:GTT_QUALIFICATION_DIR\WIN64_RUNNER_QUALIFICATION.json" `
            -ExpectedGitSha "${{ github.sha }}" `
            -ExpectedVersion "$env:GTT_EXPECTED_VERSION" `
            -MinimumFreeGiB ([int]$env:GTT_MINIMUM_FREE_GIB)

      - name: Upload qualification-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GTT-Win64-runner-qualification-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ env.GTT_QUALIFICATION_DIR }}\WIN64_RUNNER_QUALIFICATION.json
            ${{ env.GTT_QUALIFICATION_DIR }}\WIN64_RUNNER_QUALIFICATION.json.preflight.json
            ${{ env.GTT_QUALIFICATION_DIR }}\WIN64_RUNNER_QUALIFICATION.json.editor-probe.log

      - name: Preserve release boundary
        if: always()
        shell: pwsh
        run: |
          $path = "$env:GTT_QUALIFICATION_DIR\WIN64_RUNNER_QUALIFICATION.json"
          if (-not (Test-Path $path -PathType Leaf)) { throw "Runner qualification evidence missing." }
          $doc = Get-Content -Raw $path | ConvertFrom-Json
          if ($doc.human_visual_review -ne 'REQUIRED' -or [bool]$doc.demo_release_authorized) {
            throw "Runner qualification crossed the human visual review / release authorization boundary."
          }
          Write-Host "Runner qualification never authorizes a Demo Release."
