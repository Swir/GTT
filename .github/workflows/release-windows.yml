name: Windows release package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.1.14)
        required: true
        default: '0.1.14'
      configuration:
        description: Unreal build configuration
        required: true
        type: choice
        options:
          - Shipping
          - Development
        default: Shipping

concurrency:
  group: gtt-windows-release
  cancel-in-progress: false

jobs:
  package-win64:
    # Requires a project-controlled Windows x64 machine with UE 5.8 installed.
    runs-on: [self-hosted, Windows, X64, unreal-5.8]
    timeout-minutes: 120
    env:
      UE_ROOT: C:\Program Files\Epic Games\UE_5.8
      RELEASE_DIR: ${{ github.workspace }}\Releases\GTT-${{ inputs.version }}-Windows-${{ inputs.configuration }}
      PREFLIGHT_FILE: ${{ github.workspace }}\Releases\GTT-${{ inputs.version }}-Windows-${{ inputs.configuration }}.preflight.json
      ATTEMPT_FILE: ${{ github.workspace }}\Releases\GTT-${{ inputs.version }}-Windows-${{ inputs.configuration }}.attempt.json
    steps:
      - name: Checkout source and LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run repository release and Win64 contract sanity
        shell: pwsh
        run: |
          python Scripts/verify_project.py
          python Scripts/verify_release_pipeline.py
          python Scripts/verify_win64_evidence_pipeline.py
      - name: Win64 runner and Unreal 5.8 preflight
        shell: pwsh
        run: ./Scripts/preflight_win64_unreal.ps1 -EngineRoot "$env:UE_ROOT" -ProjectFile "${{ github.workspace }}\GTT.uproject" -OutputPath "$env:PREFLIGHT_FILE"
      - name: Build cook package validate and hash
        shell: pwsh
        run: |
          ./Scripts/package_windows.ps1 `
            -EngineRoot "$env:UE_ROOT" `
            -Configuration "${{ inputs.configuration }}" `
            -Version "${{ inputs.version }}" `
            -ArchiveDirectory "$env:RELEASE_DIR"
      - name: Upload validated Win64 package
        uses: actions/upload-artifact@v4
        with:
          name: GTT-${{ inputs.version }}-Windows-${{ inputs.configuration }}
          path: |
            ${{ env.RELEASE_DIR }}.zip
            ${{ env.RELEASE_DIR }}.zip.sha256
            ${{ env.RELEASE_DIR }}\WIN64_PREFLIGHT.json
            ${{ env.RELEASE_DIR }}\BUILD_ATTEMPT.json
            ${{ env.RELEASE_DIR }}\BUILD_INFO.json
            ${{ env.RELEASE_DIR }}\PACKAGE_VALIDATION.json
            ${{ env.RELEASE_DIR }}\SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload Win64 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GTT-${{ inputs.version }}-release-failure-diagnostics
          path: |
            ${{ env.PREFLIGHT_FILE }}
            ${{ env.ATTEMPT_FILE }}
            ${{ github.workspace }}\Saved\Logs\**
          if-no-files-found: warn
          retention-days: 14
