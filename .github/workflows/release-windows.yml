name: Publish reviewed Windows Demo Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact candidate version label; must match Config/DefaultGame.ini ProjectVersion
        required: true
        default: '0.1.61'
      candidate_run_id:
        description: Successful Win64 package evidence workflow run ID whose screenshots were reviewed
        required: true
      expected_sha:
        description: Exact 40-character main commit SHA of the reviewed candidate
        required: true
      visual_review_passed:
        description: I reviewed the exact candidate screenshots and approve their public demo presentation
        required: true
        type: choice
        options: ['false', 'true']
        default: 'false'
      visual_review_notes:
        description: What was visually reviewed; minimum 20 characters
        required: true
      publish_release:
        description: Create the GitHub prerelease after every gate passes
        required: true
        type: choice
        options: ['false', 'true']
        default: 'false'

permissions:
  actions: read
  contents: write
concurrency:
  group: gtt-reviewed-demo-release
  cancel-in-progress: false
jobs:
  publish-reviewed-candidate:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CANDIDATE_DOWNLOAD: ${{ github.workspace }}\CandidateArtifact
      CANDIDATE_PACKAGE: ${{ github.workspace }}\CandidatePackage
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      GTT_VERSION: ${{ inputs.version }}
      VISUAL_REVIEW_NOTES: ${{ inputs.visual_review_notes }}
    steps:
      - name: Reject incomplete review attestation
        shell: pwsh
        run: |
          if ("${{ inputs.visual_review_passed }}" -ne "true") { throw "Demo publication requires explicit visual_review_passed=true after reviewing the exact candidate screenshots." }
          if ($env:EXPECTED_SHA -notmatch '^[0-9a-fA-F]{40}$') { throw "expected_sha must be a full 40-character commit SHA." }
          if ($env:VISUAL_REVIEW_NOTES.Trim().Length -lt 20) { throw "visual_review_notes must contain at least 20 characters." }
          if ([string]::IsNullOrWhiteSpace($env:GTT_VERSION)) { throw "version must not be empty." }
      - name: Verify candidate workflow provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $run = gh api "repos/${{ github.repository }}/actions/runs/${{ inputs.candidate_run_id }}" | ConvertFrom-Json
          if ($run.name -ne 'Win64 package evidence') { throw "Run $($run.id) is not the Win64 package evidence workflow." }
          if ($run.conclusion -ne 'success') { throw "Candidate run $($run.id) did not conclude success." }
          if ($run.head_branch -ne 'main') { throw "Candidate run must originate from main; got '$($run.head_branch)'." }
          if ($run.head_sha -ne $env:EXPECTED_SHA) { throw "Candidate run SHA $($run.head_sha) does not match expected $env:EXPECTED_SHA." }
          "candidate_run_url=$($run.html_url)" | Set-Content -Encoding UTF8 "${{ github.workspace }}\candidate-provenance.txt"
      - name: Checkout the exact candidate source contract
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
      - name: Verify release version against exact candidate project metadata
        shell: pwsh
        run: |
          $ini = Get-Content -Raw "${{ github.workspace }}\Config\DefaultGame.ini"
          $match = [regex]::Match($ini, '(?m)^ProjectVersion=(.+)$')
          if (-not $match.Success) { throw "ProjectVersion is missing from Config/DefaultGame.ini." }
          $projectVersion = $match.Groups[1].Value.Trim()
          if ($env:GTT_VERSION -ne $projectVersion) { throw "Release version '$env:GTT_VERSION' does not match exact-candidate ProjectVersion '$projectVersion'." }
      - name: Download exact candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: GTT-${{ inputs.version }}-Win64-technical-candidate
          path: ${{ env.CANDIDATE_DOWNLOAD }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Verify candidate archive integrity and expand evidence
        shell: pwsh
        run: |
          $zips = @(Get-ChildItem -Path $env:CANDIDATE_DOWNLOAD -Recurse -File -Filter '*.zip')
          if ($zips.Count -ne 1) { throw "Expected exactly one candidate ZIP, found $($zips.Count)." }
          $zip = $zips[0]
          $hashFiles = @(Get-ChildItem -Path $env:CANDIDATE_DOWNLOAD -Recurse -File -Filter '*.zip.sha256')
          if ($hashFiles.Count -ne 1) { throw "Expected exactly one candidate ZIP SHA256 file, found $($hashFiles.Count)." }
          $expectedHash = ((Get-Content -Raw $hashFiles[0].FullName).Trim() -split '\s+')[0].ToLowerInvariant()
          $actualHash = (Get-FileHash -Algorithm SHA256 -Path $zip.FullName).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "Candidate ZIP SHA256 mismatch." }
          if (Test-Path $env:CANDIDATE_PACKAGE) { Remove-Item -Recurse -Force $env:CANDIDATE_PACKAGE }
          Expand-Archive -Path $zip.FullName -DestinationPath $env:CANDIDATE_PACKAGE -Force
          "candidate_zip=$($zip.FullName)" | Add-Content -Encoding UTF8 "${{ github.workspace }}\candidate-provenance.txt"
          "candidate_zip_sha256=$actualHash" | Add-Content -Encoding UTF8 "${{ github.workspace }}\candidate-provenance.txt"
      - name: Verify authored trailer import evidence is from exact candidate
        shell: pwsh
        run: |
          $path = Join-Path $env:CANDIDATE_PACKAGE 'AUTHORED_TRAILER_IMPORT.json'
          if (-not (Test-Path $path)) { throw "AUTHORED_TRAILER_IMPORT.json missing from candidate ZIP." }
          $manifest = Get-Content -Raw $path | ConvertFrom-Json
          if ($manifest.schema -ne 'gtt.authored-trailer-import.v1' -or $manifest.result -ne 'PASS') { throw "Authored trailer import evidence did not PASS." }
          if ($manifest.git_sha -ne $env:EXPECTED_SHA) { throw "Authored trailer import evidence SHA mismatch." }
          if ($manifest.version -ne $env:GTT_VERSION) { throw "Authored trailer import evidence version mismatch." }
      - name: Verify rendered evidence is from exact candidate
        shell: pwsh
        run: |
          $visual = Join-Path $env:CANDIDATE_PACKAGE 'DEMO_VISUAL_EVIDENCE.json'
          if (-not (Test-Path $visual)) { throw "DEMO_VISUAL_EVIDENCE.json missing from candidate ZIP." }
          $manifest = Get-Content -Raw $visual | ConvertFrom-Json
          if ($manifest.schema -ne 'gtt.demo-visual-evidence.v1' -or $manifest.result -ne 'PASS') { throw "Candidate rendered visual evidence did not PASS." }
          if ($manifest.git_sha -ne $env:EXPECTED_SHA) { throw "Rendered evidence SHA mismatch." }
          if ([int]$manifest.scene_count -lt 5 -or $manifest.screenshots.Count -lt 5) { throw "Candidate does not contain the five-scene visual review set." }
      - name: Bind human visual acceptance to reviewed screenshots
        shell: pwsh
        run: |
          ./Scripts/write_demo_visual_acceptance.ps1 `
            -VisualEvidencePath (Join-Path $env:CANDIDATE_PACKAGE 'DEMO_VISUAL_EVIDENCE.json') `
            -OutputPath (Join-Path $env:CANDIDATE_PACKAGE 'DEMO_VISUAL_ACCEPTANCE.json') `
            -ExpectedGitSha $env:EXPECTED_SHA `
            -Reviewer "${{ github.actor }}" `
            -Notes $env:VISUAL_REVIEW_NOTES `
            -Approved
      - name: Re-evaluate full exact-candidate gate with visual acceptance
        shell: pwsh
        run: |
          ./Scripts/evaluate_demo_candidate.ps1 `
            -PackageDirectory $env:CANDIDATE_PACKAGE `
            -RuntimeLog (Join-Path $env:CANDIDATE_PACKAGE 'GTT_RUNTIME.log') `
            -ExpectedGitSha $env:EXPECTED_SHA `
            -RequireVisual
          $gate = Get-Content -Raw (Join-Path $env:CANDIDATE_PACKAGE 'DEMO_TECHNICAL_GATE.json') | ConvertFrom-Json
          if ($gate.result -ne 'PASS' -or $gate.visual_acceptance -ne 'PASS') { throw "Final exact-candidate gate did not PASS visual acceptance." }
      - name: Write release notes and immutable review provenance
        shell: pwsh
        run: |
          $acceptance = Get-Content -Raw (Join-Path $env:CANDIDATE_PACKAGE 'DEMO_VISUAL_ACCEPTANCE.json') | ConvertFrom-Json
          $provenance = Get-Content -Raw "${{ github.workspace }}\candidate-provenance.txt"
          $notes = @"
          # Grand Theft Tractor Demo $env:GTT_VERSION

          **Source commit:** ``$env:EXPECTED_SHA``
          **Candidate evidence run:** `${{ inputs.candidate_run_id }}`
          **Visual reviewer:** ``${{ github.actor }}``
          **Visual review UTC:** ``$($acceptance.reviewed_utc)``

          This prerelease is published only after the exact packaged candidate passed Win64/UE 5.8 preflight, authored-trailer import and PhysicsAsset/socket validation, packaging evidence, packaged runtime smoke, the deterministic end-to-end gameplay/runtime route, Native Chaos telemetry, forward/reverse drivetrain exercise, loaded authored-trailer runtime exercise, five-scene rendered evidence validation, and explicit review of those exact screenshots.

          ## Visual review notes

          $env:VISUAL_REVIEW_NOTES

          ## Known status

          This is a demo prerelease, not a final game build. Any remaining non-demo-critical limitations are tracked in the repository Roadmap and playtest documents.

          ## Provenance

          $provenance
          "@
          $notes | Set-Content -Encoding UTF8 "${{ github.workspace }}\DEMO_RELEASE_NOTES.md"
      - name: Upload final review gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: GTT-${{ inputs.version }}-reviewed-demo-release-gate
          path: |
            ${{ env.CANDIDATE_PACKAGE }}\AUTHORED_TRAILER_IMPORT.json
            ${{ env.CANDIDATE_PACKAGE }}\DEMO_VISUAL_ACCEPTANCE.json
            ${{ env.CANDIDATE_PACKAGE }}\DEMO_TECHNICAL_GATE.json
            ${{ env.CANDIDATE_PACKAGE }}\DEMO_VISUAL_EVIDENCE.json
            ${{ env.CANDIDATE_PACKAGE }}\DemoVisualEvidence\*.png
            ${{ github.workspace }}\candidate-provenance.txt
            ${{ github.workspace }}\DEMO_RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30
      - name: Locate immutable release assets
        if: ${{ inputs.publish_release == 'true' }}
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem -Path $env:CANDIDATE_DOWNLOAD -Recurse -File -Filter '*.zip')
          $sha = @(Get-ChildItem -Path $env:CANDIDATE_DOWNLOAD -Recurse -File -Filter '*.zip.sha256')
          "RELEASE_ZIP=$($zip[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_SHA=$($sha[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Publish reviewed Demo prerelease
        if: ${{ inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gtt-demo-v${{ inputs.version }}
          name: Grand Theft Tractor Demo v${{ inputs.version }}
          target_commitish: ${{ inputs.expected_sha }}
          prerelease: true
          body_path: ${{ github.workspace }}\DEMO_RELEASE_NOTES.md
          files: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_SHA }}
            ${{ env.CANDIDATE_PACKAGE }}\AUTHORED_TRAILER_IMPORT.json
            ${{ env.CANDIDATE_PACKAGE }}\DEMO_VISUAL_ACCEPTANCE.json
            ${{ env.CANDIDATE_PACKAGE }}\DEMO_TECHNICAL_GATE.json
            ${{ env.CANDIDATE_PACKAGE }}\DemoVisualEvidence\*.png
          fail_on_unmatched_files: true
