name: GTT 0.1.18 runtime acceptance closure sanity
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Verify 0.1.18 runtime evidence closure
        run: python Scripts/verify_runtime_acceptance_closure.py
      - name: Regress deterministic drivetrain contract
        run: python Scripts/verify_deterministic_drivetrain_scenario.py
      - name: Regress Native Chaos runtime telemetry contract
        run: python Scripts/verify_native_runtime_telemetry.py
      - name: Regress authored trailer runtime source contract
        run: python Scripts/verify_authored_trailer_runtime.py
      - name: Regress Win64 evidence pipeline contract
        run: python Scripts/verify_win64_evidence_pipeline.py
