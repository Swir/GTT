name: GTT 0.1.31 Farm Cargo recovery runtime sanity

on:
  push:
    branches: [ main, 'milestone/**' ]
    paths:
      - 'Source/GTT/Public/Vehicles/GTTVehicleBase.h'
      - 'Source/GTT/Public/Vehicles/GTTVehicleIdentitySubsystem.h'
      - 'Source/GTT/Private/Vehicles/GTTVehicleIdentitySubsystem.cpp'
      - 'Source/GTT/Public/Core/GTTFarmCargoRecoveryEvidenceSubsystem.h'
      - 'Source/GTT/Private/Core/GTTFarmCargoRecoveryEvidenceSubsystem.cpp'
      - 'Scripts/evaluate_farm_cargo_recovery_runtime.ps1'
      - 'Scripts/smoke_test_windows.ps1'
      - 'Scripts/evaluate_demo_candidate.ps1'
      - 'Scripts/verify_farm_cargo_runtime.py'
      - 'Scripts/verify_farm_cargo_recovery.py'
      - 'Scripts/verify_farm_cargo_recovery_runtime.py'
      - '.github/workflows/win64-package-evidence.yml'
      - 'Docs/PLAYTEST_0.1.31.md'
      - 'Docs/ROADMAP.md'
      - 'README.md'
      - 'CHANGELOG.d/0.1.31.md'
      - 'assets/readme/progress-*.svg'
      - 'Scripts/generate_progress_svg.py'
  pull_request:
    paths:
      - 'Source/GTT/Public/Vehicles/GTTVehicleBase.h'
      - 'Source/GTT/Public/Vehicles/GTTVehicleIdentitySubsystem.h'
      - 'Source/GTT/Private/Vehicles/GTTVehicleIdentitySubsystem.cpp'
      - 'Source/GTT/Public/Core/GTTFarmCargoRecoveryEvidenceSubsystem.h'
      - 'Source/GTT/Private/Core/GTTFarmCargoRecoveryEvidenceSubsystem.cpp'
      - 'Scripts/evaluate_farm_cargo_recovery_runtime.ps1'
      - 'Scripts/smoke_test_windows.ps1'
      - 'Scripts/evaluate_demo_candidate.ps1'
      - 'Scripts/verify_farm_cargo_runtime.py'
      - 'Scripts/verify_farm_cargo_recovery.py'
      - 'Scripts/verify_farm_cargo_recovery_runtime.py'
      - '.github/workflows/win64-package-evidence.yml'
      - 'Docs/PLAYTEST_0.1.31.md'
      - 'Docs/ROADMAP.md'
      - 'README.md'
      - 'CHANGELOG.d/0.1.31.md'
      - 'assets/readme/progress-*.svg'
      - 'Scripts/generate_progress_svg.py'

permissions:
  contents: read

jobs:
  farm-cargo-recovery-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve 0.1.30 persistent recovery contract
        run: python3 Scripts/verify_farm_cargo_recovery.py
      - name: Preserve 0.1.29 base packaged Farm Cargo contract
        run: python3 Scripts/verify_farm_cargo_runtime.py
      - name: Verify 0.1.31 fleet identity + save/load runtime evidence contract
        run: python3 Scripts/verify_farm_cargo_recovery_runtime.py
      - name: Verify deterministic SWIR progress assets remain current
        run: python3 Scripts/generate_progress_svg.py --check
