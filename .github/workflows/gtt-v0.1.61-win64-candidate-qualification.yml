name: GTT 0.1.61 Win64 candidate qualification sanity

on:
  push:
    paths:
      - 'Config/DefaultGame.ini'
      - '.github/workflows/win64-package-evidence.yml'
      - '.github/workflows/win64-runner-qualification.yml'
      - '.github/workflows/release-windows.yml'
      - '.github/workflows/gtt-v0.1.61-win64-candidate-qualification.yml'
      - '.github/workflows/gtt-v0.1.61-win64-attested-candidate.yml'
      - 'Scripts/package_windows.ps1'
      - 'Scripts/run_win64_candidate_acceptance.ps1'
      - 'Scripts/run_win64_attested_candidate_acceptance.ps1'
      - 'Scripts/write_win64_candidate_attestation.ps1'
      - 'Scripts/verify_win64_candidate_archive.ps1'
      - 'Scripts/verify_authored_trailer_archive_evidence.ps1'
      - 'Scripts/bind_win64_runner_to_candidate.ps1'
      - 'Scripts/verify_win64_candidate_acceptance_runner.py'
      - 'Scripts/verify_v0_1_61_win64_candidate_pipeline.py'
      - 'Scripts/verify_v0_1_61_candidate_attestation.py'
      - 'Scripts/verify_v0_1_69_runner_candidate_binding.py'
      - 'Scripts/verify_win64_evidence_pipeline.py'
      - 'Scripts/import_gtt_farm_trailer_unreal.ps1'
      - 'Scripts/Unreal/import_gtt_farm_trailer.py'
      - 'Docs/PLAYTEST_0.1.61_WIN64_CANDIDATE_QUALIFICATION.md'
      - 'Docs/ROADMAP.md'
      - 'CHANGELOG.d/0.1.61-win64-candidate-qualification.md'
  pull_request:
    paths:
      - 'Config/DefaultGame.ini'
      - '.github/workflows/win64-package-evidence.yml'
      - '.github/workflows/win64-runner-qualification.yml'
      - '.github/workflows/release-windows.yml'
      - '.github/workflows/gtt-v0.1.61-win64-candidate-qualification.yml'
      - '.github/workflows/gtt-v0.1.61-win64-attested-candidate.yml'
      - 'Scripts/package_windows.ps1'
      - 'Scripts/run_win64_candidate_acceptance.ps1'
      - 'Scripts/run_win64_attested_candidate_acceptance.ps1'
      - 'Scripts/write_win64_candidate_attestation.ps1'
      - 'Scripts/verify_win64_candidate_archive.ps1'
      - 'Scripts/verify_authored_trailer_archive_evidence.ps1'
      - 'Scripts/bind_win64_runner_to_candidate.ps1'
      - 'Scripts/verify_win64_candidate_acceptance_runner.py'
      - 'Scripts/verify_v0_1_61_win64_candidate_pipeline.py'
      - 'Scripts/verify_v0_1_61_candidate_attestation.py'
      - 'Scripts/verify_v0_1_69_runner_candidate_binding.py'
      - 'Scripts/verify_win64_evidence_pipeline.py'
      - 'Scripts/import_gtt_farm_trailer_unreal.ps1'
      - 'Scripts/Unreal/import_gtt_farm_trailer.py'
      - 'Docs/PLAYTEST_0.1.61_WIN64_CANDIDATE_QUALIFICATION.md'
      - 'Docs/ROADMAP.md'
      - 'CHANGELOG.d/0.1.61-win64-candidate-qualification.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-candidate-qualification-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse current-gate PowerShell fail-closed
        shell: pwsh
        run: |
          $targets = @(
            'Scripts/run_win64_candidate_acceptance.ps1',
            'Scripts/run_win64_attested_candidate_acceptance.ps1',
            'Scripts/write_win64_candidate_attestation.ps1',
            'Scripts/verify_win64_candidate_archive.ps1',
            'Scripts/verify_authored_trailer_archive_evidence.ps1',
            'Scripts/bind_win64_runner_to_candidate.ps1'
          )
          foreach ($target in $targets) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $target),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${target}: $($_.Message) at $($_.Extent.Text)" }
              throw "PowerShell parse failed for $target"
            }
          }
      - name: Verify fail-closed Win64 candidate and release lane
        run: python Scripts/verify_v0_1_61_win64_candidate_pipeline.py
      - name: Verify one-command Windows candidate acceptance runner
        run: python Scripts/verify_win64_candidate_acceptance_runner.py
      - name: Verify exact-candidate attestation and self-hosted qualification lane
        run: python Scripts/verify_v0_1_61_candidate_attestation.py
      - name: Verify exact runner/toolchain to sealed candidate binding
        run: python Scripts/verify_v0_1_69_runner_candidate_binding.py
      - name: Preserve full Win64 evidence and release regression contract
        run: python Scripts/verify_win64_evidence_pipeline.py
