name: GTT 0.1.51 workshop priority pickup sanity

on:
  push:
    paths:
      - 'Source/GTT/Public/Save/GTTWorkshopQueueSaveGame.h'
      - 'Source/GTT/Public/World/GTTWorkshopRepairQueueSubsystem.h'
      - 'Source/GTT/Private/World/GTTWorkshopRepairQueueSubsystem.cpp'
      - 'Source/GTT/Public/World/GTTWorkshopJobBoardTerminal.h'
      - 'Source/GTT/Private/World/GTTWorkshopJobBoardTerminal.cpp'
      - 'Source/GTT/Public/World/GTTWorkshopPriorityDeskTerminal.h'
      - 'Source/GTT/Private/World/GTTWorkshopPriorityDeskTerminal.cpp'
      - 'Source/GTT/Public/Core/GTTWorkshopLegacyEvidencePickupBridgeSubsystem.h'
      - 'Source/GTT/Private/Core/GTTWorkshopLegacyEvidencePickupBridgeSubsystem.cpp'
      - 'Source/GTT/Private/World/GTTGarageSlotTerminal.cpp'
      - 'Scripts/verify_workshop_priority_pickup.py'
      - 'Scripts/verify_workshop_job_board.py'
      - 'Scripts/verify_workshop_service_lifecycle.py'
      - 'Scripts/verify_workshop_multi_vehicle_capacity.py'
      - 'Scripts/verify_workshop_capacity_runtime.py'
      - 'Docs/PLAYTEST_0.1.51.md'
      - 'Docs/ROADMAP.md'
      - 'README.md'
      - 'CHANGELOG.d/0.1.51.md'
      - '.github/workflows/gtt-0.1.51-workshop-priority-pickup.yml'
  pull_request:
    paths:
      - 'Source/GTT/Public/Save/GTTWorkshopQueueSaveGame.h'
      - 'Source/GTT/Public/World/GTTWorkshopRepairQueueSubsystem.h'
      - 'Source/GTT/Private/World/GTTWorkshopRepairQueueSubsystem.cpp'
      - 'Source/GTT/Public/World/GTTWorkshopJobBoardTerminal.h'
      - 'Source/GTT/Private/World/GTTWorkshopJobBoardTerminal.cpp'
      - 'Source/GTT/Public/World/GTTWorkshopPriorityDeskTerminal.h'
      - 'Source/GTT/Private/World/GTTWorkshopPriorityDeskTerminal.cpp'
      - 'Source/GTT/Public/Core/GTTWorkshopLegacyEvidencePickupBridgeSubsystem.h'
      - 'Source/GTT/Private/Core/GTTWorkshopLegacyEvidencePickupBridgeSubsystem.cpp'
      - 'Source/GTT/Private/World/GTTGarageSlotTerminal.cpp'
      - 'Scripts/verify_workshop_priority_pickup.py'
      - 'Scripts/verify_workshop_job_board.py'
      - 'Scripts/verify_workshop_service_lifecycle.py'
      - 'Scripts/verify_workshop_multi_vehicle_capacity.py'
      - 'Scripts/verify_workshop_capacity_runtime.py'
      - 'Docs/PLAYTEST_0.1.51.md'
      - 'Docs/ROADMAP.md'
      - 'README.md'
      - 'CHANGELOG.d/0.1.51.md'
      - '.github/workflows/gtt-0.1.51-workshop-priority-pickup.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 0.1.51 priority pickup and fleet return contract
        run: python Scripts/verify_workshop_priority_pickup.py
      - name: Re-run 0.1.50 job board regression contract
        run: python Scripts/verify_workshop_job_board.py
      - name: Re-run 0.1.49 timed lifecycle regression contract
        run: python Scripts/verify_workshop_service_lifecycle.py
      - name: Re-run 0.1.48 packaged capacity source contract
        run: python Scripts/verify_workshop_capacity_runtime.py
      - name: Re-run 0.1.47 multi-vehicle capacity regression contract
        run: python Scripts/verify_workshop_multi_vehicle_capacity.py
      - name: Verify SWIR progress presentation remains deterministic
        run: |
          python Scripts/generate_progress_svg.py --check
          python Scripts/verify_progress_presentation.py
