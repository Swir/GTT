name: Project sanity

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify repository structure
        run: python Scripts/verify_project.py

      - name: Verify combat milestone
        run: python Scripts/verify_combat.py

      - name: Verify Arc 3 campaign milestone
        run: python Scripts/verify_arc3.py

      - name: Verify heavy haul milestone
        run: python Scripts/verify_heavy_haul.py

      - name: Verify rural factions milestone
        run: python Scripts/verify_factions.py

      - name: Verify rural economy and road law milestone
        run: python Scripts/verify_rural_economy.py

      - name: Verify Arc 4 and North Pass countryside milestone
        run: python Scripts/verify_arc4.py

      - name: Verify unified world-state milestone
        run: python Scripts/verify_unified_save.py

      - name: Verify world performance milestone
        run: python Scripts/verify_world_performance.py

      - name: Verify player experience milestone
        run: python Scripts/verify_player_experience.py

      - name: Verify release pipeline milestone
        run: python Scripts/verify_release_pipeline.py
